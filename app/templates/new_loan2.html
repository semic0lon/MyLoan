{% extends "base.html" %}

{% block content %}

<h2>เพิ่มรายการเงินกู้ใหม่</h2>

<form method="POST">
    <label>วันที่กู้:</label><br>
    <input type="date" name="loan_date" required><br><br>

    <label>เงินต้น:</label><br>
    <input type="number" step="0.01" name="principal" required><br><br>

    <label>ดอกเบี้ย (% ต่อปี):</label><br>
    <input type="number" step="0.01" name="interest_rate" required><br><br>

    <button type="submit">บันทึก</button>
</form>

<br>
<a href="/">⬅ กลับหน้าแรก</a>

{% endblock %}
