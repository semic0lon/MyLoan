{% extends "base.html" %}

{% block content %}

<h2>รายการเงินกู้ทั้งหมด</h2>

{% for loan in loans %}
    <div style="border:1px solid #ccc; padding:10px; margin:10px;">
        <p>วันที่กู้: {{ loan.loan_date }}</p>
        <p>เงินต้นคงเหลือ: {{ loan.calculate_status().principal }}</p>
        <p>ดอกเบี้ยสะสม: {{ loan.calculate_status().interest }}</p>
    </div>
{% endfor %}

{% endblock %}
