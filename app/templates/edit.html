{% extends "base.html" %}

{% block content %}
<h2>Edit Loan</h2>

<form method="POST">
    <label>Name:</label><br>
    <input type="text" name="name" value="{{ loan.name }}"><br><br>

    <label>Amount:</label><br>
    <input type="number" name="amount" value="{{ loan.amount }}"><br><br>

    <button type="submit">Update</button>
</form>

{% endblock %}
